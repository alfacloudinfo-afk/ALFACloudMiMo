<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2540">
<title>ALFACloud V1.0 — Admin Console</title>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{
--navy:#0A2540; --navy2:#14365E; --navy3:#1B4A84;
--blue:#1663FF; --blue-dark:#0E4FD6; --blue-soft:#E8F0FF;
--navy-soft:#E9EDF3; --bg:#EFF3F9; --surface:#FFFFFF;
--line:#DDE6F2; --text:#0A2540; --muted:#5D7190;
--radius:14px; --shadow:0 8px 24px rgba(10,37,64,.08);
--header-h:62px; --sidebar-w:264px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100dvh;overflow:hidden}
/* SIDEBAR LIGHT */
.sidebar{width:var(--sidebar-w);flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100dvh;z-index:50}
.brand{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--navy),var(--blue));box-shadow:0 6px 16px rgba(22,99,255,.25)}
.brand h1{margin:0;font-size:18px;letter-spacing:-.03em;color:var(--navy)} .brand h1 span{color:var(--blue)}
.brand small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.status-panel{margin:10px 12px 8px;padding:11px;border-radius:12px;background:var(--bg);border:1px solid var(--line);flex:0 0 auto}
.device-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.device-status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--navy)}
.online-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px rgba(22,99,255,.15);animation:pulse 2.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(22,99,255,0)}}
.admin-badge{padding:4px 7px;border-radius:7px;background:var(--navy);color:#fff;font-size:9px;font-weight:800;letter-spacing:.1em}
.quick-mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.quick-mini button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:10px;font-weight:800}
.quick-mini button:first-child{background:var(--blue);border-color:var(--blue);color:#fff}
.quick-mini i{width:14px;height:14px}
.nav-label{padding:4px 18px 6px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;flex:0 0 auto}
.navigation{flex:1;overflow-y:auto;padding:0 10px 12px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.nav-item{position:relative;display:flex;width:100%;align-items:center;gap:11px;min-height:40px;margin:2px 0;padding:9px 11px;border:0;border-radius:10px;color:#3D4E6B;background:transparent;text-align:left;font-size:12.5px;font-weight:600;transition:.18s}
.nav-item i{width:17px;height:17px;flex:0 0 auto;color:var(--muted)}
.nav-item:hover{background:var(--blue-soft);color:var(--navy)} .nav-item:hover i{color:var(--blue)}
.nav-item.active{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 6px 16px rgba(10,37,64,.18)} .nav-item.active i{color:#fff}
.nav-item.logout{margin-top:8px;color:var(--blue-dark);border-top:1px solid var(--line);border-radius:0}
/* MAIN + HEADER - changed for contrast */
.main{flex:1;display:flex;flex-direction:column;height:100dvh;overflow:hidden;min-width:0}
.topbar{flex:0 0 var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:linear-gradient(135deg,#0A2540 0%,#13365E 55%,#164E9E 100%);color:#fff;box-shadow:0 4px 18px rgba(10,37,64,.25);z-index:30}
.topbar-left,.topbar-actions,.profile{display:flex;align-items:center;gap:11px}
.breadcrumbs{font-size:12px;color:#B9C9E2} .breadcrumbs strong{color:#fff}
.icon-button{display:grid;width:38px;height:38px;place-items:center;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;transition:.2s}
.icon-button:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)} .icon-button i{width:17px;height:17px}
.menu-toggle{display:none}
.profile{padding-left:11px;border-left:1px solid rgba(255,255,255,.18)}
.avatar{display:grid;width:36px;height:36px;place-items:center;border-radius:10px;background:#fff;color:var(--navy);font-size:11px;font-weight:900}
.profile strong,.profile small{display:block} .profile strong{font-size:12px;color:#fff} .profile small{font-size:10px;color:#B9C9E2}
/* CONTENT - no page scroll */
.content{flex:1;overflow:hidden;padding:12px 18px 10px;min-height:0;display:flex;flex-direction:column}
.page{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.page-head-compact{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{color:var(--blue);font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:2px}
.page-head-compact h2{margin:0;font-size:20px;letter-spacing:-.03em;line-height:1.1}
.page-head-compact p{margin:3px 0 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:640px}
.action-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 13px;border-radius:10px;border:1px solid transparent;font-size:11px;font-weight:800;transition:.2s;white-space:nowrap}
.btn i{width:15px;height:15px} .btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(10,37,64,.14)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff}
.btn-dark{background:var(--navy);color:#fff}
.btn-secondary{background:#fff;border-color:var(--line);color:var(--navy)}
.btn-sm{min-height:32px;padding:6px 10px;font-size:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:14px} .card-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)} .card-header h3{margin:0;font-size:13px} .card-header p{margin:2px 0 0;color:var(--muted);font-size:10px} .card-body{padding:14px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800;white-space:nowrap}
.badge::before{width:5px;height:5px;border-radius:50%;background:currentColor;content:""}
.badge.blue{background:var(--blue-soft);color:var(--blue-dark)} .badge.navy{background:var(--navy);color:#fff} .badge.gray{background:var(--navy-soft);color:var(--muted)} .badge.line{background:#fff;border:1px solid var(--line);color:var(--navy)}
label{display:block;margin-bottom:5px;color:#3D4E6B;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
input,select,textarea{width:100%;min-height:38px;padding:8px 11px;border:1px solid #D2DCEA;border-radius:10px;background:#FBFCFE;color:var(--text);font-size:12px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(22,99,255,.12)}
textarea{min-height:64px;resize:none}
.search-wrap{position:relative} .search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)} .search-wrap input{padding-left:32px}
/* HOME fixed filter */
.home-filter-fixed{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);position:sticky;top:0;z-index:15}
.filter-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip-row{display:flex;align-items:center;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:10px;font-weight:800;transition:.2s}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.chip-count{margin-left:auto;font-size:10px;font-weight:800;color:var(--blue-dark);background:var(--blue-soft);padding:4px 9px;border-radius:999px}
/* DATA CARDS (no tables) */
.data-grid{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-content:start}
.c-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.2s;min-height:78px}
.c-card:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 8px 18px rgba(22,99,255,.12)}
.mini-avatar{display:grid;width:36px;height:36px;flex:0 0 auto;place-items:center;border-radius:10px;background:var(--blue-soft);color:var(--blue-dark);font-size:11px;font-weight:900}
.mini-avatar.navy{background:var(--navy);color:#fff}
.c-main{flex:1;min-width:0} .c-main strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .c-main small{color:var(--muted);font-size:10px} .c-route{font-size:9px;font-weight:800;color:var(--blue-dark);margin-top:2px}
.c-side{text-align:right;flex:0 0 auto} .c-side strong{display:block;font-size:12px} .c-side .badge{margin-top:3px}
.icon-mini{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);flex:0 0 auto} .icon-mini i{width:14px;height:14px}
.pager{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 0 1px}
.pg-btn{min-width:30px;height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.pg-btn.active{background:var(--blue);border-color:var(--blue);color:#fff} .pg-btn:disabled{opacity:.4}
.empty-note,.notice-box{padding:12px;border-radius:11px;background:#F3F7FC;color:#3D4E6B;font-size:11px;line-height:1.55;border:1px solid var(--line)}
.notice-box.warn{background:#FFF8E9;border-color:#FFE0A5;color:#7A5200}
.notice-box.navy{background:var(--navy);border-color:var(--navy);color:#D7E3F5}
/* BOTTOM NAV - home only */
.bottom-nav{flex:0 0 auto;display:none;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(10,37,64,.12);padding:6px;margin-top:8px;width:min(560px,100%);margin-left:auto;margin-right:auto}
.bottom-nav.show{display:flex}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--muted);padding:6px 2px;border-radius:10px;min-height:48px}
.bottom-nav button i{width:19px;height:19px}
.bottom-nav button span{font-size:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.bottom-nav button.active,.bottom-nav button:hover{background:var(--blue-soft);color:var(--blue-dark)}
/* DAILY compact */
.daily-control{flex:0 0 auto;padding:10px 12px}
.daily-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.radio-group{display:flex;gap:8px;flex-wrap:wrap}
.radio{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#FBFCFE;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;transition:.2s}
.radio.checked{background:var(--navy);border-color:var(--navy);color:#fff}
.radio input{display:none} .radio-dot{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;opacity:.9}
.radio.checked .radio-dot{background:#fff;border-color:#fff;box-shadow:inset 0 0 0 3px var(--navy)}
.daily-controls-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.daily-tiles{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:74px;box-shadow:var(--shadow)}
.tile.hl{background:linear-gradient(135deg,var(--navy),var(--navy2));border-color:var(--navy);color:#fff} .tile.hl span{color:#B9C9E2} .tile.hl strong{color:#fff}
.tile.bl{background:linear-gradient(135deg,var(--blue),var(--blue-dark));border-color:var(--blue);color:#fff} .tile.bl span{color:#D3E3FF} .tile.bl strong{color:#fff}
.tile span{font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile strong{font-size:12.5px;letter-spacing:-.02em}
.tile small{font-size:9px;color:var(--muted)} .tile.hl small,.tile.bl small{color:rgba(255,255,255,.85)}
.daily-foot{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.daily-progress{flex:1;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;min-width:0}
.progress{flex:1;height:7px;overflow:hidden;border-radius:99px;background:#E8EEF5;min-width:60px}
.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--navy));transition:width .5s}
/* Grids */
.grid{display:grid;gap:10px} .stats-4{grid-template-columns:repeat(4,1fr)} .two-col{grid-template-columns:1.4fr .9fr} .equal-2{grid-template-columns:1fr 1fr} .three-col{grid-template-columns:repeat(3,1fr)}
.stat-mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.stat-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;background:var(--blue-soft);color:var(--blue-dark)} .stat-ic.navy{background:var(--navy);color:#fff} .stat-ic i{width:16px;height:16px}
.stat-mini strong{display:block;font-size:15px;letter-spacing:-.03em} .stat-mini small{color:var(--muted);font-size:10px;font-weight:600}
.summary-list{display:grid} .summary-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px} .summary-item:last-child{border:0} .summary-item span{color:var(--muted)} 
.route-row{padding:8px 0;border-bottom:1px solid var(--line)} .route-row:last-child{border:0} .route-meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:6px}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);flex:0 0 auto}
.tab{flex:1;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:8px;font-size:10px;font-weight:800;white-space:nowrap} .tab.active{background:var(--navy);color:#fff}
.chart{display:flex;height:132px;align-items:flex-end;gap:9px;padding-top:10px} .bar-group{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%;text-align:center} .bar{min-height:8px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--blue),var(--navy));transition:height .5s} .bar-group small{color:var(--muted);font-size:8px;font-weight:700}
.hero{position:relative;overflow:hidden;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#0A2540 0%,#164E9E 100%);border-radius:var(--radius);flex:0 0 auto}
.hero::after{position:absolute;right:-30px;bottom:-70px;width:180px;height:180px;border:1px solid rgba(255,255,255,.18);border-radius:50%;box-shadow:0 0 0 22px rgba(255,255,255,.05),0 0 0 48px rgba(255,255,255,.03);content:""}
.hero h3{position:relative;z-index:1;margin:0 0 4px;font-size:16px} .hero p{position:relative;z-index:1;margin:0 0 10px;color:#C9D9F0;font-size:11px;max-width:560px} .hero .btn{position:relative;z-index:1;background:#fff;color:var(--navy);border:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .form-grid.three{grid-template-columns:1fr 1fr 1fr} .field.full{grid-column:1/-1}
.input-row{display:flex;gap:8px} .input-row input{flex:1}
.result-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:11px;border-radius:12px;background:var(--blue-soft);border:1px solid #C9DAFF} .result-box div{padding:4px 10px;border-right:1px solid #B9CCF0} .result-box div:last-child{border:0} .result-box span{display:block;font-size:8px;font-weight:800;color:var(--blue-dark);text-transform:uppercase;margin-bottom:2px} .result-box strong{display:block;font-size:14px;color:var(--navy)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .toggle-row:last-child{border:0} .toggle-row strong{display:block;font-size:12px} .toggle-row small{color:var(--muted);font-size:10px}
.switch{position:relative;width:42px;height:23px;flex:0 0 auto} .switch input{opacity:0;width:0;height:0} .slider{position:absolute;inset:0;border-radius:99px;background:#CBD6E6;transition:.25s} .slider::before{position:absolute;left:3px;bottom:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);content:"";transition:.25s} .switch input:checked+.slider{background:var(--blue)} .switch input:checked+.slider::before{transform:translateX(19px)}
.log-list{display:grid;gap:0} .log-entry{padding:7px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#3D4E6B} .log-entry.error{color:var(--navy);font-weight:700}
.about-avatar{display:grid;width:64px;height:64px;margin:0 auto 10px;place-items:center;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-size:20px;font-weight:900;box-shadow:0 10px 24px rgba(22,99,255,.25)}
.stepper{display:flex;gap:6px;margin-bottom:10px} .step{flex:1;height:4px;border-radius:99px;background:var(--line)} .step.active{background:var(--blue)} .step.done{background:var(--navy)}
.step-labels{display:flex;gap:6px;margin:-6px 0 10px} .step-labels span{flex:1;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)} .step-labels span.on{color:var(--blue-dark)}
.pay-tabs{display:none;gap:6px;margin-bottom:8px} .pay-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px;font-size:10px;font-weight:800;color:var(--muted)} .pay-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(10,37,64,.55);backdrop-filter:blur(4px);display:none;place-items:center;padding:14px}
.modal-overlay.open{display:grid}
.modal-card{width:min(580px,100%);max-height:88dvh;background:#fff;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.28);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:var(--bg);flex:0 0 auto}
.modal-head h3{margin:0;font-size:14px} .modal-head p{margin:2px 0 0;font-size:10px;color:var(--muted)}
.modal-x{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy)} .modal-x i{width:15px;height:15px}
.modal-body{padding:13px 15px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fff;flex:0 0 auto;flex-wrap:wrap}
.pay-card{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;background:#FBFDFF}
.pay-top{display:flex;align-items:center;gap:9px;margin-bottom:8px} .pay-top div{flex:1;min-width:0} .pay-top strong{display:block;font-size:12px} .pay-top small{color:var(--muted);font-size:10px} .pay-amt{color:var(--blue-dark);font-size:13px}
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}
.pay-grid div span{display:block;font-size:7.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:1px} .pay-grid div strong{font-size:11px}
.detail-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}

function startBatchPrint(list){
if(!list.length){toast("Nothing to print","No payments to send to printer.","navy");return;}
if(!state.printer.connected){addLog("error",`Print failed — Bluetooth ${state.printer.mac} unavailable. ${list.length} receipts queued.`);
openModal("Printer Unavailable","Bluetooth 58mm thermal printer",`<div class="notice-box warn"><strong>Cannot print ${list.length} receipt(s).</strong><br>Printer <strong>${esc(state.printer.mac)}</strong> is disconnected. Connect it in Printer Settings. Payments and data remain unaffected.</div><div style="margin-top:10px">${logHTML()}</div>`,`<button class="btn btn-secondary" data-action="close-modal">CLOSE</button><button class="btn btn-dark" data-nav="printer-settings">OPEN PRINTER SETTINGS</button>`);toast("Printer unavailable","Connect the 58mm printer in Printer Settings.","navy");return;}
let idx=0;
openModal("Printing Daily Batch",`${list.length} receipts · 58mm · ${state.printer.mac}`,
`<div class="print-progress-wrap"><div class="print-progress-head"><span id="ppCount">Preparing…</span><strong id="ppPct">0%</strong></div><div class="progress"><span id="ppBar" style="width:0%"></span></div></div>
<div class="receipt-58" id="batchReceipt"><div style="text-align:center">Waiting…</div></div>
<div class="print-queue">${list.map((p,i)=>`<div class="q-item" id="q-${i}"><span>${i+1}. ${p.customerId} · ${money0(p.amount)}</span><span class="q-status">QUEUED</span></div>`).join("")}</div>`,
`<button class="btn btn-secondary" data-action="close-modal">CANCEL</button>`);
function step(){
if(!document.getElementById("ppBar"))return;
if(idx>=list.length){document.getElementById("ppCount").textContent=`Completed ${list.length}/${list.length}`;document.getElementById("ppPct").textContent="100%";document.getElementById("ppBar").style.width="100%";
document.getElementById("modalFoot").innerHTML=`<button class="btn btn-secondary" data-action="close-modal">CLOSE</button><button class="btn btn-primary" data-action="close-modal"><i data-lucide="check"></i>DONE</button>`;lucide.createIcons();
toast("Batch print complete",`${list.length} receipts sent via Bluetooth.`);addLog("info",`Batch print completed: ${list.length} receipts via ${state.printer.mac}.`);return;}
const p=list[idx];
document.getElementById("batchReceipt").innerHTML=`<div style="text-align:center;font-weight:800;font-size:13px">ALFACloud Finance</div><div style="text-align:center;font-size:10px;margin:2px 0 6px">*** 58mm RECEIPT ***</div><div style="border-top:1px dashed #0A2540;margin:6px 0"></div><div>CUST&nbsp;&nbsp;: ${p.customerId}</div><div>LOAN&nbsp;&nbsp;: ${p.loan}</div><div>NAME&nbsp;&nbsp;: ${esc(p.customer).slice(0,18)}</div><div>PAID&nbsp;&nbsp;: ${money0(p.amount)}.00</div><div>TIME&nbsp;&nbsp;: ${p.time}</div><div>DATE&nbsp;&nbsp;: ${p.date}</div><div style="border-top:1px dashed #0A2540;margin:6px 0"></div><div style="text-align:center">Thank you!</div><div style="text-align:center;font-size:9px">${esc(state.printer.mac)}</div>`;
document.getElementById("ppCount").textContent=`Printing ${idx+1}/${list.length} · ${p.customerId}`;const pct=Math.round(idx/list.length*100);document.getElementById("ppPct").textContent=pct+"%";document.getElementById("ppBar").style.width=pct+"%";
const q=document.getElementById("q-"+idx);if(q){q.classList.add("printing");q.querySelector(".q-status").textContent="PRINTING";}
addLog("info",`BT → ${state.printer.mac} | ${p.customerId} | ${money0(p.amount)} (${idx+1}/${list.length})`);
setTimeout(()=>{if(q){q.classList.remove("printing");q.classList.add("done");q.querySelector(".q-status").textContent="SENT ✓";}idx++;setTimeout(step,320);},720);}
step();}

function calculate(prefix){const amt=Number(document.getElementById(prefix+"Amount")?.value||0),rate=Number(document.getElementById(prefix+"Rate")?.value||0),dur=Number(document.getElementById(prefix+"Duration")?.value||1);
if(amt<=0||rate<0||dur<=0){toast("Invalid calculation","Enter positive amount and duration.","navy");return;}
const profit=amt*rate/100,end=amt+profit,inst=end/dur;
if(prefix==="calc"){document.getElementById("calcInstallment").textContent=money(inst);document.getElementById("calcEnd").textContent=money(end);document.getElementById("calcProfit").textContent=money(profit);document.getElementById("calcInterest").textContent=rate.toFixed(2)+"%";}
else{document.getElementById("loanInstallment").textContent=money(inst);document.getElementById("loanEndValue").textContent=money(end);document.getElementById("loanProfit").textContent=money(profit);}
toast("Calculation complete","Loan values updated.");}

else if(a==="refresh"){b.querySelector("i")?.classList.add("spin");toast("Data refreshed","Latest synchronized records displayed.");setTimeout(()=>b.querySelector("i")?.classList.remove("spin"),800);}
else if(a==="notifications")toast("No new alerts","All notifications up to date.");
else if(a==="print"||a==="test-print"){if(!state.printer.connected){addLog("error","Bluetooth print failed — printer unavailable.");toast("Printer unavailable","Connect 58mm printer. Core functions unaffected.","navy");openModal("Print Failed","58mm Bluetooth",`<div class="notice-box warn"><strong>Printer ${esc(state.printer.mac)} unavailable.</strong><br>Error logged. Try connecting in Printer Settings.</div>`,`<button class="btn btn-secondary" data-action="close-modal">CLOSE</button><button class="btn btn-dark" data-nav="printer-settings">SETTINGS</button>`);}else{addLog("info",`Test receipt sent to ${state.printer.mac}.`);toast("Receipt sent","Sent to 58mm Bluetooth printer.");openModal("Test Print Sent","58mm · "+state.printer.mac,`<div class="receipt-58"><div style="text-align:center;font-weight:800">ALFACloud Finance</div><div style="text-align:center;font-size:10px">*** TEST ***</div><div style="border-top:1px dashed #0A2540;margin:6px 0"></div><div>PRINTER: OK</div><div>MAC: ${esc(state.printer.mac)}</div><div>TIME: ${new Date().toLocaleTimeString()}</div><div style="border-top:1px dashed #0A2540;margin:6px 0"></div><div style="text-align:center">Ready!</div></div>`,`<button class="btn btn-primary" data-action="close-modal">DONE</button>`);}}
else if(a==="load"||a==="detailed")toast("Data loaded","Requested records displayed.");
else if(a==="daily-detail")openDailyDetail();
else if(a==="daily-print"){const d=getDailyData();closeModal();setTimeout(()=>startBatchPrint(d.list),120);}
else if(a==="sms")toast("SMS sent","Payment confirmation sent.");
else if(a==="calculator")calculate("calc");
else if(a==="calculate-loan")calculate("loan");
else if(a==="lookup-customer"){const id=document.getElementById("paymentCustomerId").value.trim().toUpperCase();const c=state.customers.find(x=>x.id===id);const l=state.loans.find(x=>x.cid===id);if(!c||!l){toast("Customer not found","Check ID and retry.","navy");return;}document.getElementById("paymentName").textContent=c.name;document.getElementById("paymentMeta").textContent=c.id+" · "+c.route;document.getElementById("paymentLoan").value=l.id;document.getElementById("paymentBalance").value=money(l.balance);document.getElementById("paymentAmount").textContent=money(l.amount);document.getElementById("paymentInstallment").textContent=money(l.installment);document.getElementById("paymentOutstanding").textContent=money(l.balance);toast("Customer loaded",c.name+" — active loan found.");}
else if(a==="view-customer")viewCustomer(b.dataset.id);
else if(a==="view-loan"){if(e.target.closest("[data-nav]"))return;viewLoan(b.dataset.id);}
else if(a==="view-route")viewRoute(b.dataset.id);
else if(a==="view-fin"){const t=state.finance[+b.dataset.id];if(!t)return;openModal(t.ref,t.desc,`<div class="pay-grid"><div><span>Date</span><strong>${esc(t.date)}</strong></div><div><span>Category</span><strong>${esc(t.cat)}</strong></div><div><span>Income</span><strong>${t.income?money(t.income):"—"}</strong></div><div><span>Expense</span><strong>${t.expense?money(t.expense):"—"}</strong></div></div><div class="field" style="margin-top:10px"><label>Edit Note</label><input value="${esc(t.desc)}"></div>`,`<button class="btn btn-secondary" data-action="close-modal">CLOSE</button><button class="btn btn-dark" data-action="edit-row">SAVE NOTE</button>`);}
else if(a==="page"){const k=b.dataset.key,p=+b.dataset.p;if(k==="home"){state.homePage=p;renderHomeGrid();}else if(k==="cust"){state.custPage=p;renderCustGrid();}else if(k==="loan"){state.loanPage=p;renderLoanGrid("loan",false);}else if(k==="payMgr"){state.payPage=p;render("payment-manager");}else if(k==="fin"){state.finPage=p;renderFinGrid();}}
else if(a==="home-status"){state.homeStatus=b.dataset.s;state.homePage=1;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.s===state.homeStatus));renderHomeGrid();}
else if(a==="analyzer-tab"){state.analyzerTab=b.dataset.tab;document.querySelectorAll("#analyzerTabs .tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===state.analyzerTab));updateAnalyzer();}
else if(a==="bar-pop")toast(b.dataset.d+" · "+b.dataset.v+"%","Tap LOAD REPORT for full popup.","navy");
else if(a==="analyzer-popup"){openModal(state.analyzerTab+" Breakdown","Full 7-period popup",`<div class="summary-list">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<div class="summary-item"><span>${d}</span><strong>${document.querySelectorAll("#chart .bar")[i]?.style.height||"—"}</strong></div>`).join("")}</div>`,`<button class="btn btn-primary" data-action="close-modal">GOT IT</button>`);}
else if(a==="info-pop"){const m={cust:["Active Customers","119 across 3 routes. Colombo 01 leads at 82%."],loan:["Active Loans","94 loans · Portfolio Rs 475,000"],done:["Completed","43 closed · 100% recovered"],arr:["Arrears","11 accounts · Rs 32,800 · action needed"]}[b.dataset.k];openModal(m[0],"Popup breakdown",`<div class="notice-box navy">${m[1]}</div><div class="action-row" style="margin-top:10px"><button class="btn btn-secondary btn-sm" data-nav="customer-manager">VIEW CUSTOMERS</button><button class="btn btn-secondary btn-sm" data-nav="loan-manager">VIEW LOANS</button></div>`,`<button class="btn btn-primary" data-action="close-modal">CLOSE</button>`);}
else if(a==="fin-pop"){openModal("Financial Popup",b.dataset.k.toUpperCase(),`<div class="notice-box">Detailed ${esc(b.dataset.k)} breakdown loaded. Use LOAD with filters for date-range modal reports.</div>`,`<button class="btn btn-primary" data-action="close-modal">OK</button>`);}
else if(a==="calc-popup"){openModal("Repayment Schedule","30-installment preview",`<div class="pay-grid" style="grid-template-columns:1fr 1fr 1fr">${[1,2,3,4,5,6].map(i=>`<div><span>Inst ${i}</span><strong>${money0(4000)}</strong></div>`).join("")}</div><div class="empty-note" style="margin-top:8px">Showing first 6 of 30. Full schedule available after loan creation.</div>`,`<button class="btn btn-primary" data-action="close-modal">CLOSE</button>`);}
else if(a==="delete-row"){openModal("Delete Record?","Admin action",`<div class="notice-box warn">This deletion cannot be undone. Continue?</div>`,`<button class="btn btn-secondary" data-action="close-modal">CANCEL</button><button class="btn btn-dark" data-action="confirm-delete">DELETE</button>`);}
else if(a==="confirm-delete"){closeModal();toast("Record deleted","Selected record removed.");}
else if(a==="delete-customer"){const id=b.dataset.id;openModal("Delete "+id+"?","Admin",`<div class="notice-box warn">Remove customer <strong>${id}</strong>? Loans linked will be hidden.</div>`,`<button class="btn btn-secondary" data-action="close-modal">CANCEL</button><button class="btn btn-dark" data-action="confirm-del-cust" data-id="${id}">DELETE</button>`);}
else if(a==="confirm-del-cust"){state.customers=state.customers.filter(c=>c.id!==b.dataset.id);closeModal();toast("Customer deleted",b.dataset.id+" removed.");render(state.page);}
else if(a==="edit-row")toast("Edit mode enabled","Record available for admin editing.");
else if(a==="save-loan-bal"){const l=state.loans.find(x=>x.id===b.dataset.id);const v=Number(document.getElementById("editLoanBal").value);if(l&&v>=0){l.balance=v;const c=state.customers.find(x=>x.id===l.cid);if(c)c.balance=v;toast("Balance saved",l.id+" → "+money(v));closeModal();if(state.page==="loan-manager")renderLoanGrid("loan",false);}else toast("Invalid value","Enter 0 or more.","navy");}
else if(a==="save-collector"){const r=state.routes.find(x=>x.id===b.dataset.id);if(r){r.collector=document.getElementById("routeCollector").value||r.collector;toast("Collector saved",r.name+" → "+r.collector);closeModal();if(state.page==="route-manager")render("route-manager");}}
else if(a==="route-collect"){state.dailyRoute=b.dataset.r;state.dailyMode="today";render("daily");}
else if(a==="add-route"){openModal("Add Route","New collection route",`<div class="form-grid"><div class="field"><label>Route Name</label><input id="nrName" placeholder="e.g., Homagama"></div><div class="field"><label>Collector</label><input id="nrCol" placeholder="Collector name"></div></div>`,`<button class="btn btn-secondary" data-action="close-modal">CANCEL</button><button class="btn btn-primary" data-action="save-route">SAVE ROUTE</button>`);}
else if(a==="save-route"){const n=document.getElementById("nrName").value||"New Route",c=document.getElementById("nrCol").value||"Unassigned";state.routes.push({id:"RT-0"+(state.routes.length+1),name:n,collector:c,customers:0,expected:6000,progress:0});closeModal();toast("Route added",n+" created.");render("route-manager");}
else if(a==="add-expenditure"){openModal("Add Expenditure","Popup form",`<div class="form-grid"><div class="field"><label>Description</label><input id="exDesc" placeholder="e.g., Fuel"></div><div class="field"><label>Amount Rs</label><input id="exAmt" type="number" value="1500"></div><div class="field"><label>Category</label><select id="exCat"><option>Travel</option><option>Office</option><option>Utilities</option></select></div><div class="field"><label>Date</label><input type="date" value="${TODAY}"></div></div>`,`<button class="btn btn-secondary" data-action="close-modal">CANCEL</button><button class="btn btn-primary" data-action="save-ex">SAVE</button>`);}
else if(a==="save-ex"){const d=document.getElementById("exDesc").value||"Expenditure",v=Number(document.getElementById("exAmt").value||0),c=document.getElementById("exCat").value;state.finance.unshift({date:"Today",ref:"EX-0"+(100+state.finance.length),desc:d,cat:c,income:0,expense:v});closeModal();toast("Expenditure saved",d+" · "+money0(v));renderFinGrid();}
else if(a==="find-receipt"){const v=document.getElementById("receiptSearch").value;document.getElementById("rcNo").textContent=v||"R-90881";toast("Receipt found",v+" loaded as card.");}
else if(a==="save-settings"||a==="save-printer")toast("Settings saved","Configuration stored.");
else if(a==="clear-mac"){document.getElementById("macAddress").value="";toast("Address cleared","Enter MAC before connecting.","navy");}
else if(a==="edit-mac")toast("Edit mode enabled","MAC field editable.");
else if(a==="toggle-bluetooth"){const mac=document.getElementById("macAddress")?.value||state.printer.mac;state.printer.mac=mac||state.printer.mac;state.printer.connected=!state.printer.connected;addLog("info",state.printer.connected?`Bluetooth connected: ${state.printer.mac}.`:`Bluetooth disconnected.`);toast(state.printer.connected?"Printer connected":"Printer disconnected",state.printer.connected?"58mm printing available.":"Core functions remain available.",state.printer.connected?"blue":"navy");render("printer-settings");}
else if(a==="clear-log"){state.logs=[];document.getElementById("logList").innerHTML=`<div class="empty-note">No logged events.</div>`;toast("Log cleared","Event history cleared.");}
else if(a==="view-full-log"){openModal("Full Application Log",state.logs.length+" events",`${state.logs.slice().reverse().map(l=>`<div class="log-entry ${l.type}">[${l.time}] ${esc(l.text)}</div>`).join("")||'<div class="empty-note">Empty.</div>'}`,`<button class="btn btn-primary" data-action="close-modal">CLOSE</button>`);}
else if(a==="restart"){addLog("info","Application restart simulated.");toast("Application restarted","Services reinitialized.");}
else if(a==="set-tab"){state.settingsTab=b.dataset.t;render("general-settings");}
else if(a==="pay-tab"){state.payTab=b.dataset.t;render("add-payment");}
else if(a==="cust-next"){state.addCustStep=Math.min(3,state.addCustStep+1);render("add-customer");}
else if(a==="cust-back"){state.addCustStep=Math.max(1,state.addCustStep-1);render("add-customer");}
else if(a==="loan-next"){state.addLoanStep=2;render("add-loan");}
else if(a==="loan-back"){state.addLoanStep=1;render("add-loan");}
});
document.addEventListener("input",e=>{
if(e.target.id==="homeSearch"){state.homeSearch=e.target.value;state.homePage=1;renderHomeGrid();}
if(e.target.id==="custSearch"){state.custSearch=e.target.value;state.custPage=1;renderCustGrid();}
if(e.target.id==="loanSearch"){state.loanSearch=e.target.value;state.loanPage=1;renderLoanGrid("loan",false);}
if(e.target.id==="paySearch"){state.paySearch=e.target.value;state.payPage=1;const g=document.getElementById("payMgrGrid"),pg=document.getElementById("payMgrPager");const f=state.loans.filter(l=>(l.id+" "+l.customer).toLowerCase().includes(state.paySearch.toLowerCase()));const sz=pageSize(),total=Math.max(1,Math.ceil(f.length/sz));g.innerHTML=f.slice(0,sz).map(l=>loanCard(l,true)).join("");pg.innerHTML=pagerHTML(1,total,"payMgr");lucide.createIcons();}
});
document.addEventListener("change",e=>{
if(e.target.id==="homeRoute"){state.homeRoute=e.target.value;state.homePage=1;renderHomeGrid();}
if(e.target.name==="dmode"){state.dailyMode=e.target.value;document.querySelectorAll(".radio").forEach(r=>r.classList.remove("checked"));e.target.closest(".radio").classList.add("checked");document.getElementById("dailyDateWrap").style.display=state.dailyMode==="custom"?"":"none";updateDailyTiles();toast(state.dailyMode==="today"?"Today Collection":"Custom Date",state.dailyMode==="today"?"Showing today's route totals.":"Pick a date to load totals.");}
if(e.target.id==="dailyRoute"){state.dailyRoute=e.target.value;updateDailyTiles();}
if(e.target.id==="dailyDate"){state.dailyDate=e.target.value||TODAY;updateDailyTiles();}
});
document.addEventListener("submit",e=>{
if(e.target.id==="loginForm"){e.preventDefault();document.getElementById("loginScreen").style.display="none";render("home");toast("Welcome back","Administrator access restored.");return;}
const f=e.target.dataset.form;if(!f)return;e.preventDefault();
if(f==="payment"){const amt=Number(e.target.querySelector('input[type="number"]').value);const loan=document.getElementById("paymentLoan").value;const cust=document.getElementById("paymentName").textContent;state.payments.unshift({receipt:"R-"+Math.floor(91000+Math.random()*800),customerId:document.getElementById("paymentCustomerId").value.toUpperCase(),loan,loanAmount:75000,customer:cust,amount:amt,time:new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}),date:TODAY,route:"Colombo 01",method:"Cash"});toast("Payment saved",money(amt)+" recorded. SMS independent.");openModal("Payment Saved",money(amt)+" · "+cust,`<div class="notice-box navy">Receipt generated. Print via Bluetooth or send SMS from popups.</div><div class="receipt-58" style="margin-top:10px">ALFACloud<br>${money(amt)} · ${cust}<br>${TODAY}<br>Thank you!</div>`,`<button class="btn btn-secondary" data-action="close-modal">CLOSE</button><button class="btn btn-dark" data-nav="print-receipt">PRINT RECEIPT</button>`);}
else if(f==="loan"){toast("Loan created","Schedule saved.");openModal("Loan Created","Success",`<div class="notice-box navy">Installment <strong>${document.getElementById("loanInstallment")?.textContent||""}</strong> · End <strong>${document.getElementById("loanEndValue")?.textContent||""}</strong></div>`,`<button class="btn btn-secondary" data-action="close-modal">CLOSE</button><button class="btn btn-primary" data-nav="loan-manager">VIEW LOANS</button>`);}
else if(f==="customer"){const d=new FormData(e.target);state.customers.push({id:"C-"+(1000+state.customers.length+1),name:d.get("name")||"New Customer",phone:d.get("phone")||"07X XXX XXXX",route:d.get("route")||"Colombo 01",balance:0,status:"Active"});state.addCustStep=1;toast("Customer added","Available for loans.");render("customer-manager");}
});
document.getElementById("modalOverlay").addEventListener("click",e=>{if(e.target.id==="modalOverlay")closeModal();});
document.getElementById("menuToggle").addEventListener("click",()=>document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click",()=>document.body.classList.remove("sidebar-open"));
window.addEventListener("resize",()=>{applyPayTab();if(state.page==="home")renderHomeGrid();});
render("home");
</script>
</body>
</html>
